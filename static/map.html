<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Hospital map</title>
<style>
  :root { --ink:#1F2A30; --muted:#5B6B73; --line:#D5DDE1; --bg:#F4F6F7; --card:#fff; --brand:#075E54; --red:#B3261E;
          --opd:#D9D3FB; --diagnostic:#C9EDE1; --treatment:#FBD9CB; --emergency:#F7C1C1; --support:#DCE8F7; --ward:#E9E7E1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system, "Segoe UI", Helvetica, Arial, "Noto Sans Devanagari", sans-serif; font-size:15px; line-height:1.45; }
  header { background:var(--brand); color:#fff; padding:14px 16px; }
  header h1 { font-size:19px; font-weight:600; } header p { font-size:12.5px; color:#CFE9E4; margin-top:2px; }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 16px 40px; }
  .note { font-size:13px; color:var(--red); margin:0 0 12px; }
  .search { position:relative; margin-bottom:14px; }
  .search input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; color:var(--ink); }
  .results { position:absolute; left:0; right:0; top:46px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:5; max-height:340px; overflow:auto; display:none; }
  .results.on { display:block; }
  .results button { display:block; width:100%; text-align:left; border:none; background:none; padding:9px 12px; font:inherit; color:var(--ink); cursor:pointer; border-bottom:1px solid #EEF2F3; }
  .results button:hover { background:#F4F6F7; } .results small { color:var(--muted); display:block; font-size:12.5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:17px; margin-bottom:8px; }
  img.plan { width:100%; height:auto; display:block; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .tabs, .floors { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tabs button, .floors button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
  .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .floors button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; margin-top:10px; }
  .list button { text-align:left; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
  .list small { display:block; color:var(--muted); font-size:12.5px; }
  .det .loc { margin:6px 0; padding:8px 10px; border-radius:8px; background:#F4F6F7; }
  .det .loc b { display:block; font-size:12.5px; color:var(--muted); }
  .det p { margin:6px 0; } .det .way { font-size:14px; }
  .det a { color:var(--brand); font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><h1 id="title">Hospital map</h1><p>Every building, floor and department from the TMH Patient Booklet</p></header>
<div class="wrap">
  <p class="note" id="disc"></p>
  <div class="search"><input id="q" placeholder="Search a department, e.g. MRI, blood test, pharmacy, breast OPD" autocomplete="off">
    <div class="results" id="res"></div></div>
  <div class="card det" id="det" hidden></div>
  <div class="card"><h2>Campus</h2><img class="plan" src="/map/campus.png" alt="Tata Memorial Hospital campus: the five buildings and the main gate"></div>
  <div class="card"><h2>Inside the buildings</h2>
    <div class="tabs" id="tabs"></div><div class="floors" id="floors"></div>
    <img class="plan" id="floorImg" alt="">
    <div class="list" id="list"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let H, used = [], block = "GJB", floor = "G";
const B = (id) => H.blocks.find((b) => b.id === id), F = (id) => H.floors.find((f) => f.id === id);
const whereText = (l) => [B(l.block).name, F(l.floor).name.toLowerCase(), l.rooms].filter(Boolean).join(", ");
function locs(u) {
  if (!u.block) return [];
  const out = [{ kind: "general", id: u.id, l: u }];
  if (u.private) out.push({ kind: "private", id: u.id + "@private", l: u.private });
  (u.also || []).forEach((a, i) => out.push({ kind: "also", id: `${u.id}@${i + 2}`, l: a }));
  return out;
}
function show(u) {
  const d = $("det"), ls = locs(u), two = !!u.private;
  let h = `<h2>${esc(u.name)} <span class="muted">${esc(u.name_hi || "")}</span></h2>`;
  if (u.unlisted) {
    const a = H.units.find((x) => x.id === u.ask);
    h += `<p>${esc(u.note)}</p><p>➡️ <b>${esc(a.name)}</b>: ${esc(locs(a).map((x) => whereText(x.l)).join("; "))}</p>`;
  } else if (u.dmg) {
    h += `<p>${esc(u.where)}</p><p>${esc(u.note)}</p>`;
  } else if (u.public === false) {
    h += `<p>${esc(locs(u).map((x) => whereText(x.l)).join("; "))}: staff only.</p>`;
  } else {
    for (const x of ls) {
      const who = x.kind === "general" ? (two ? "General patients" : "Where") : x.kind === "private" ? "Private patients" : "Also at";
      h += `<div class="loc"><b>${who}</b>${esc(whereText(x.l))}<div class="way">🚶 ${esc(x.l.path || "")}</div>
            <a href="/map/route.jpg?from=GATE1&to=${encodeURIComponent(x.id)}" target="_blank">Route map from the main gate</a> ·
            <a href="#" data-b="${x.l.block}" data-f="${x.l.floor}">See the floor</a></div>`;
    }
    if (u.hours) h += `<p><b>Timings:</b> ${esc(u.hours)}</p>`;
    if (u.bring) h += `<p><b>Bring:</b> ${esc(u.bring)}</p>`;
    if (u.note) h += `<p>${esc(u.note)}</p>`;
  }
  h += `<p class="muted">Source: TMH Patient Booklet 2025 ${esc(u.source || "")}</p>`;
  d.innerHTML = h; d.hidden = false;
  d.querySelectorAll("a[data-b]").forEach((a) => a.onclick = (e) => { e.preventDefault(); pick(a.dataset.b, a.dataset.f); $("floorImg").scrollIntoView({ behavior: "smooth" }); });
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}
function pick(b, f) {
  block = b;
  const fl = used.filter((x) => x.block === b).map((x) => x.floor);
  floor = fl.includes(f) ? f : fl[0];
  $("tabs").innerHTML = H.blocks.map((x) => `<button data-b="${x.id}" class="${x.id === block ? "on" : ""}">${esc(x.name)}</button>`).join("");
  $("floors").innerHTML = fl.map((x) => `<button data-f="${x}" class="${x === floor ? "on" : ""}">${esc(F(x).name)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((btn) => btn.onclick = () => pick(btn.dataset.b, null));
  $("floors").querySelectorAll("button").forEach((btn) => btn.onclick = () => pick(block, btn.dataset.f));
  $("floorImg").src = `/map/floor.png?b=${block}&f=${floor}`;
  $("floorImg").alt = `${B(block).name}, ${F(floor).name}`;
  const here = H.units.flatMap((u) => locs(u).filter((x) => x.l.block === block && x.l.floor === floor && u.public !== false).map((x) => ({ u, x })));
  $("list").innerHTML = here.map(({ u, x }, i) => `<button data-i="${i}" style="background:var(--${u.cat})">${esc(u.name)}<small>${esc(
    [x.kind === "private" ? "Private patients" : "", x.l.rooms].filter(Boolean).join(" · ") || " ")}</small></button>`).join("");
  $("list").querySelectorAll("button").forEach((btn) => btn.onclick = () => show(here[+btn.dataset.i].u));
}
function search() {
  const q = $("q").value.trim().toLowerCase();
  if (q.length < 2) { $("res").classList.remove("on"); return; }
  const hits = H.units.filter((u) => (u.name + " " + (u.name_hi || "")).toLowerCase().includes(q)).slice(0, 12);
  $("res").innerHTML = hits.map((u, i) => `<button data-i="${i}">${esc(u.name)}<small>${esc(u.unlisted ? "Not in the booklet" : u.dmg ? "Depends on your cancer type" :
    locs(u).map((x) => whereText(x.l)).join("; "))}</small></button>`).join("") || `<div class="muted" style="padding:10px">No match</div>`;
  $("res").classList.add("on");
  $("res").querySelectorAll("button").forEach((b) => b.onclick = () => { $("res").classList.remove("on"); show(hits[+b.dataset.i]); });
}
(async () => {
  [H, { used_floors: used }] = await Promise.all([fetch("/api/hospital").then((r) => r.json()), fetch("/api/places").then((r) => r.json())]);
  $("title").textContent = "Hospital map · " + H.name;
  $("disc").textContent = H.disclaimer;
  $("q").oninput = search;
  pick("GJB", "G");
})();
</script>
</body>
</html>
